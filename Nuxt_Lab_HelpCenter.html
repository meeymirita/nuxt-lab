document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ontent:center;align-items:flex-start;padding:10vh 16px 0\">\n<div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(680px,100%);background:var(--paper);border:2px solid var(--ink);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;max-height:72vh\">\n<div style=\"display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:2px solid var(--ink)\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg><input ref=\"{{ searchRef }}\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onQ }}\" sc-camel-on-key-down=\"{{ onSearchKey }}\" placeholder=\"Шаг, тема или термин: pivot, 2.3, Policy…\" style=\"flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:400 19px var(--font-body)\"><span style=\"font-family:'JetBrains Mono';font-size:11px;color:var(--muted)\">Esc<\u002Fspan><\u002Fdiv>\n<div style=\"overflow:auto\">\n<sc-for list=\"{{ results }}\" as=\"r\" hint-placeholder-count=\"5\"><button sc-camel-on-click=\"{{ r.onClick }}\" sc-camel-on-mouse-enter=\"{{ r.onHover }}\" style=\"width:100%;display:grid;grid-template-columns:96px 48px minmax(0,1fr);gap:10px;padding:10px 18px;border:0;border-bottom:1px solid var(--hair);background:{{ r.bg }};color:{{ r.ink }};font:400 14px var(--font-body);text-align:left;cursor:pointer\"><span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;padding-top:2px\">{{ r.group }}<\u002Fspan><span style=\"font-family:'JetBrains Mono';font-size:13px\">{{ r.num }}<\u002Fspan><span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><b style=\"font-size:15px;line-height:1.3\">{{ r.title }}<\u002Fb><span style=\"font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.snip }}<\u002Fspan><\u002Fspan><\u002Fbutton><\u002Fsc-for>\n<sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:20px 18px;color:var(--muted);font-size:15px\">Ничего не найдено<\u002Fdiv><\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"display:flex;gap:20px;padding:10px 18px;border-top:2px solid var(--hair);font-size:12px;color:var(--muted)\"><span>↑↓ выбрать<\u002Fspan><span>Enter открыть<\u002Fspan><span style=\"margin-left:auto\">{{ searchHint }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;posters&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведение&quot;},&quot;strictGate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Поведение&quot;}}\">\nclass Component extends DCLogic {\n  KEY = 'lab-redesign-v1';\n  state = { ready: false, at: 'home', last: null, mode: 'steps', theme: 'light', done: {}, quiz: {}, tSess: 0, tTotal: 0, running: false, pop: null, sOpen: false, q: '', sIdx: 0 };\n  scrollRef = React.createRef();\n  searchRef = React.createRef();\n  els = new Map();\n\n  componentDidMount() {\n    const wait = () => (window.LAB ? this.init() : (this.wt = setTimeout(wait, 50)));\n    wait();\n    this.tick = setInterval(() => {\n      if (!this.state.running) return;\n      this.setState(s => ({ tSess: s.tSess + 1, tTotal: s.tTotal + 1 }), () => { if (this.state.tTotal % 5 === 0) this.save(); });\n    }, 1000);\n    this.onKey = e => {\n      const typing = /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '');\n      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.setState(s => ({ sOpen: !s.sOpen, q: '', sIdx: 0 })); return; }\n      if (e.key === 'Escape') { this.setState({ sOpen: false, pop: null }); return; }\n      if (typing || this.state.sOpen) return;\n      if (e.key === '/') { e.preventDefault(); this.setState({ sOpen: true, q: '', sIdx: 0 }); return; }\n      if (this.state.mode === 'steps' && this.state.at !== 'home') {\n        const seq = this.seq(), i = seq.indexOf(this.state.at);\n        if (e.key === 'ArrowRight' && seq[i + 1]) this.go(seq[i + 1]);\n        if (e.key === 'ArrowLeft' && seq[i - 1]) this.go(seq[i - 1]);\n      }\n    };\n    window.addEventListener('keydown', this.onKey);\n    this.onHash = () => this.goHash();\n    window.addEventListener('hashchange', this.onHash);\n    document.body.dataset.theme = this.state.theme;\n  }\n  componentWillUnmount() { clearInterval(this.tick); clearTimeout(this.wt); window.removeEventListener('keydown', this.onKey); window.removeEventListener('hashchange', this.onHash); this.save(); }\n\n  init() {\n    const L = window.LAB; this.L = L; this.U = {}; this.S = {}; this.KEY = 'lab-redesign-v1:' + (L.slug || 'lab'); try { document.title = L.title; } catch (e) {}\n    if (L.accent) this.applyAccent(L.accent);\n    L.units.forEach(u => (this.U[u.key] = u));\n    L.sessions.forEach(s => (this.S[s.n] = s));\n    this.allKeys = [...L.units.filter(u => u.kind === 'theory'), ...L.units.filter(u => u.kind === 'step'), ...L.units.filter(u => u.kind === 'ref')].map(u => u.key);\n    const gl = { theory: 'Теория', step: 'Шаги', ref: 'Справка' };\n    this.index = L.units.map(u => ({ id: 'u:' + u.key, group: gl[u.kind], num: u.num, title: u.title, t: u.title.toLowerCase(), x: (u.text || '').toLowerCase(), raw: u.text || '' }));\n    ((L.glossKey && this.U[L.glossKey].gloss) || []).forEach(g => this.index.push({ id: 'u:' + L.glossKey, group: 'Глоссарий', num: '', title: g.term, t: g.term.toLowerCase(), x: g.def.toLowerCase(), raw: g.def, gloss: true }));\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) {}\n    const keep = {};\n    ['done', 'quiz', 'last', 'mode', 'theme', 'tSess', 'tTotal'].forEach(k => saved[k] !== undefined && (keep[k] = saved[k]));\n    this.setState({ ready: true, ...keep }, () => this.goHash());\n  }\n  applyAccent(hex) {\n    const toRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));\n    const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));\n    const lum = c => { const f = c.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2]; };\n    const onWhite = c => 1.05 / (lum(c) + 0.05);\n    const hexOf = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');\n    let base = toRgb(hex);\n    for (let i = 0; i < 12 && onWhite(base) < 3.6; i++) base = mix(base, [0, 0, 0], 0.08);\n    const W = [255, 255, 255], K = [0, 0, 0];\n    let ink = base; for (let i = 0; i < 20 && (lum([243, 242, 242]) + 0.05) / (lum(ink) + 0.05) < 5; i++) ink = mix(ink, K, 0.07);\n    const ramp = {\n      '--color-accent': hexOf(base), '--color-accent-500': hexOf(base),\n      '--color-accent-100': hexOf(mix(base, W, 0.88)), '--color-accent-200': hexOf(mix(base, W, 0.75)),\n      '--color-accent-300': hexOf(mix(base, W, 0.5)), '--color-accent-400': hexOf(mix(base, W, 0.25)),\n      '--color-accent-600': hexOf(mix(base, K, 0.15)), '--color-accent-700': hexOf(ink),\n      '--color-accent-800': hexOf(mix(ink, K, 0.3)), '--color-accent-900': hexOf(mix(ink, K, 0.55))\n    };\n    const r = document.documentElement.style, b = document.body.style;\n    Object.entries(ramp).forEach(([k, v]) => { r.setProperty(k, v); b.setProperty(k, v); });\n  }\n  save() {\n    const { done, quiz, last, mode, theme, tSess, tTotal } = this.state;\n    try { localStorage.setItem(this.KEY, JSON.stringify({ done, quiz, last, mode, theme, tSess, tTotal })); } catch (e) {}\n  }\n  componentDidUpdate(pp, ps) {\n    const s = this.state;\n    document.body.dataset.theme = s.theme;\n    if (['done', 'quiz', 'last', 'mode', 'theme'].some(k => ps[k] !== s[k])) this.save();\n    if (!ps.sOpen && s.sOpen) setTimeout(() => this.searchRef.current?.focus(), 0);\n    if (this.pendingScroll) { const id = this.pendingScroll; this.pendingScroll = null; requestAnimationFrame(() => this.scrollToId(id)); }\n    if (this.pendingTop) { this.pendingTop = false; if (this.scrollRef.current) this.scrollRef.current.scrollTop = 0; }\n  }\n\n  posters() { return this.props.posters ?? true; }\n  strict() { return this.props.strictGate ?? true; }\n  seq() {\n    const L = this.L, ids = [];\n    L.units.filter(u => u.kind === 'theory').forEach(u => ids.push('u:' + u.key));\n    L.sessions.forEach(s => { if (this.posters()) ids.push('p:' + s.n); s.steps.forEach(k => ids.push('u:' + k)); });\n    L.units.filter(u => u.kind === 'ref').forEach(u => ids.push('u:' + u.key));\n    return ids;\n  }\n  group(id) {\n    if (!id || id === 'home') return null;\n    if (id[0] === 'p') return +id.slice(2);\n    const u = this.U[id.slice(2)];\n    return u.kind === 'step' ? u.session : u.kind === 'theory' ? 'T' : 'R';\n  }\n  gKeys(g) {\n    if (g === 'T') return this.L.units.filter(u => u.kind === 'theory').map(u => u.key);\n    if (g === 'R') return this.L.units.filter(u => u.kind === 'ref').map(u => u.key);\n    return this.S[g].steps;\n  }\n  firstUndone(keys) { return keys.find(k => !this.state.done[k]) || keys[0]; }\n  dom(id) { return 'x-' + id.replace(':', '-'); }\n  go(id) {\n    if (id === 'home') { this.setState({ at: 'home', pop: null, sOpen: false }); return; }\n    if (id[0] === 'p' && !this.posters()) id = 'u:' + this.S[+id.slice(2)].steps[0];\n    if (this.state.mode === 'feed') this.pendingScroll = id; else this.pendingTop = true;\n    this.setState({ at: id, last: id, pop: null, sOpen: false });\n  }\n  goHash() {\n    const h = decodeURIComponent((window.location.hash || '').slice(1));\n    if (h && this.U && this.U[h]) this.go('u:' + h);\n  }\n  scrollToId(id) {\n    const sc = this.scrollRef.current, el = document.getElementById(this.dom(id));\n    if (!sc || !el) return;\n    this.spyLock = true;\n    sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop;\n    setTimeout(() => (this.spyLock = false), 150);\n  }\n  spy() {\n    const sc = this.scrollRef.current; if (!sc) return;\n    const top = sc.getBoundingClientRect().top; let cur = null;\n    for (const id of this.seq()) {\n      const el = document.getElementById(this.dom(id)); if (!el) continue;\n      if (el.getBoundingClientRect().top - top <= 140) cur = id; else break;\n    }\n    if (cur && cur !== this.state.at) this.setState({ at: cur, last: cur });\n  }\n  gateOk(key) {\n    if (!this.strict()) return true;\n    const u = this.U[key]; if (!u.quiz || !u.quiz.length) return true;\n    const q = this.state.quiz[key] || [];\n    return u.quiz.every((_, i) => q[i]);\n  }\n  mark(key, v) { this.setState(s => ({ done: { ...s.done, [key]: v } })); }\n  toggleQ(key, i) { this.setState(s => { const q = [...(s.quiz[key] || [])]; q[i] = !q[i]; return { quiz: { ...s.quiz, [key]: q } }; }); }\n  el(k, html, tag) {\n    if (!this.els.has(k)) this.els.set(k, React.createElement(tag || 'div', { key: k, dangerouslySetInnerHTML: { __html: html } }));\n    return this.els.get(k);\n  }\n  fmt(t) { const p = n => String(n).padStart(2, '0'); return `${p(Math.floor(t / 3600))}:${p(Math.floor(t / 60) % 60)}:${p(t % 60)}`; }\n  plural(n, a, b, c) { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; }\n  short(t, n) { return t.length > n ? t.slice(0, n - 1).trim() + '…' : t; }\n  label(id) {\n    if (!id) return '';\n    if (id[0] === 'p') return 'Сессия ' + id.slice(2);\n    const u = this.U[id.slice(2)];\n    return u.num + ' ' + this.short(u.title, 34);\n  }\n\n  vmUnit(id, feed) {\n    if (id[0] === 'p') {\n      const s = this.S[+id.slice(2)], dn = s.steps.filter(k => this.state.done[k]).length;\n      return { isPosterItem: true, isDoc: false, isStep: false, domId: this.dom(id), n: s.n, nn: String(s.n).padStart(2, '0'), title: s.title, dur: s.dur, cnt: `${dn} из ${s.steps.length}` };\n    }\n    const key = id.slice(2), u = this.U[key], done = !!this.state.done[key], ok = this.gateOk(key);\n    const base = {\n      isPosterItem: false, domId: this.dom(id), done, showInlineMark: feed,\n      markLabel: done ? '✓ Пройдено — снять отметку' : u.kind === 'step' ? 'Шаг пройден' : 'Раздел прочитан',\n      markDisabled: !done && !ok, onMark: () => this.mark(key, !done),\n      markBg: done ? 'var(--ink)' : ok ? 'var(--color-accent)' : 'var(--hair)',\n      markInk: done ? 'var(--paper)' : ok ? '#fff' : 'var(--muted)',\n      markHint: !done && !ok ? 'Сначала отметьте вопросы «Проверь себя»' : ''\n    };\n    if (u.kind !== 'step') {\n      return { ...base, isDoc: true, isStep: false, num: u.num, title: u.title, kicker: u.kind === 'theory' ? `Теория · раздел ${u.num}` : 'Справка', el: this.el(key, u.html) };\n    }\n    const s = this.S[u.session], idx = s.steps.indexOf(key), q = this.state.quiz[key] || [];\n    const qd = u.quiz.filter((_, i) => q[i]).length;\n    return {\n      ...base, isDoc: false, isStep: true, num: u.num, title: u.title,\n      kicker: `Сессия ${s.n} · шаг ${idx + 1} из ${s.steps.length}`,\n      introEl: this.el(key + ':i', u.intro),\n      hasResult: !!u.result, resultEl: u.result ? this.el(key + ':r', u.result) : null,\n      hasWhy: !!u.why, whyEl: u.why ? this.el(key + ':w', u.why) : null,\n      deep: u.deep.map((d, i) => ({ summary: d.summary, el: this.el(key + ':d' + i, d.html) })),\n      hasQuiz: u.quiz.length > 0, quizCount: `${qd} из ${u.quiz.length}`,\n      quiz: u.quiz.map((h, i) => ({ el: this.el(key + ':q' + i, h, 'span'), onToggle: () => this.toggleQ(key, i), boxBg: q[i] ? 'var(--ink)' : 'transparent', mark: q[i] ? '✓' : '', ink: q[i] ? 'var(--muted)' : 'var(--ink)' })),\n      hasOutro: !!u.outro, outroLabel: u.outro ? u.outro.label : '', outroEl: u.outro ? this.el(key + ':o', u.outro.html) : null\n    };\n  }\n\n  renderVals() {\n    const st = th    ...common, ...searchVals, isHome: true, isApp: false,\n        doneCount, totalCount: total, donePct: Math.round(doneCount / total * 100) + '%',\n        labTitle: L.title, hasIntro: !!L.introHtml, introEl: L.introHtml ? this.el('intro', L.introHtml) : null,\n        theoryRange: range(thU), refRange: range(rfU),\n        sessLabel: `${L.sessions.length} ${this.plural(L.sessions.length, 'сессия', 'сессии', 'сессий')}`,\n        continueKicker: doneCount || st.last ? 'Продолжить' : 'Начать',\n        continueLabel: this.label(contId),\n        onContinue: () => this.go(contId),\n        subtitle: L.subtitle, tocEl: this.el('toc', L.tocHtml),\n        theoryCnt: `${th.filter(u => st.done[u.key]).length} из ${th.length}`,\n        stepsCnt: `${stepsDone} из ${L.sessions.reduce((a, s) => a + s.steps.length, 0)} шагов`,\n        theoryCells: th.map(cell), refCells: rf.map(cell),\n        sessCells: L.sessions.map(s => {\n          const dn = s.steps.filter(k => st.done[k]).length, cur = curG === s.n;\n          return {\n            nn: String(s.n).padStart(2, '0'), title: s.title, dur: s.dur,\n            cnt: dn === s.steps.length ? 'Сессия пройдена' : `${dn} из ${s.steps.length} ${this.plural(s.steps.length, 'шага', 'шагов', 'шагов')}`,\n            bg: cur ? 'var(--fill)' : 'transparent',\n            numInk: cur ? 'var(--color-accent)' : dn === s.steps.length ? 'var(--ink)' : 'var(--faint)',\n            bars: s.steps.map(k => ({ c: st.done[k] ? 'var(--ink)' : 'var(--hair)' })),\n            onClick: () => this.go(this.posters() ? 'p:' + s.n : 'u:' + this.firstUndone(s.steps))\n          };\n        }),\n        resetAll: () => { if (confirm('Сбросить весь прогресс, ответы и таймеры?')) this.setState({ done: {}, quiz: {}, tSess: 0, tTotal: 0, running: false, last: null }); }\n      };\n    }\n\n    const at = st.at, curG = this.group(at), atKey = at[0] === 'u' ? at.slice(2) : null;\n    const groups = [{ id: 'T', label: 'Т' }, ...L.sessions.map(s => ({ id: s.n, l ne(keys)) : 'u:' + this.firstUndone(keys))\n      };\n    });\n    const gk = this.gKeys(curG);\n    const tabs = [];\n    if (typeof curG === 'number' && this.posters()) tabs.push({ id: 'p:' + curG, label: 'Обзор', tip: 'Начало сессии' });\n    gk.forEach(k => tabs.push({ id: 'u:' + k, label: this.U[k].num, tip: this.U[k].title, key: k }));\n    const sCur = typeof curG === 'number' ? this.S[curG] : null;\n    const isPosterView = !feed && at[0] === 'p';\n    const shownIds = feed ? seq : isPosterView ? [] : [at];\n    const shown = shownIds.map(id => this.vmUnit(id, feed));\n\n    let f = {}, showFooter = false;\n    if (!feed && atKey) {\n      showFooter = true;\n      const u = this.U[atKey], i = seq.indexOf(at), prev = seq[i - 1], next = seq[i + 1];\n      const done = !!st.done[atKey], ok = this.gateOk(atKey), q = st.quiz[atKey] || [];\n      const qd = u.quiz ? u.quiz.filter((_, j) => q[j]).length : 0;\n      const isStep = u.kind === 'step';\n      f = {\n        hasPrev: !!prev, prevLabel: this.label(prev), onPrev: () => this.go(prev),\n        hint: done ? (isStep ? 'Шаг пройден' : 'Раздел прочитан') : !ok ? `Отметьте «Проверь себя» (${qd} из ${u.quiz.length}), чтобы закрыть шаг` : '',\n        unmarkShow: done, onUnmark: () => this.mark(atKey, false),\n        skipShow: !done && !!next, onSkip: () => this.go(next),\n        primaryLabel: done ? (next ? `Дальше: ${this.label(next)} →` : 'На главную →') : (isStep ? 'Шаг пройден' : 'Прочитано') + (next ? ', дальше →' : ''),\n        primaryDisabled: !done && !ok,\n        primaryBg: !done && !ok ? 'var(--hair)' : 'var(--color-accent)',\n        primaryInk: !done && !ok ? 'var(--muted)' : '#fff',\n        cursor: !done && !ok ? 'not-allowed' : 'pointer',\n        onPrimary: () => { if (!done) { if (!ok) return; this.mark(atKey, true); } this.go(next || 'home'); }\n      };\n    }\n    let p = {};\n    if (isPosterView) {\n      const s = this.S[+at.slice(2)], dn = s.steps.filter(k => st.done[k]).length, fu =
